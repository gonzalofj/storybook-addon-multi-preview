name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate the pipeline without uploading to npm'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Check npm auth
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Resolve dist-tag
        id: dist-tag
        # Channel by prerelease identifier: 1.2.3-beta.1 -> `beta`,
        # 1.2.3-rc.1 -> `rc`, stable -> `latest`. Production `latest` only
        # moves when a stable version is released.
        run: |
          echo "tag=$(node -p "const v = require('./package.json').version; v.includes('-') ? v.split('-')[1].split('.')[0] : 'latest'")" >> "$GITHUB_OUTPUT"
      - run: npm publish --provenance --access public --tag ${{ steps.dist-tag.outputs.tag }} ${{ inputs.dry_run == true && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
